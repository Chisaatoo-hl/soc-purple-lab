services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: soc_gold
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  metabase:
    image: metabase/metabase:latest
    ports: ["3000:3000"]
    depends_on: [postgres]
volumes:
  pgdata:
