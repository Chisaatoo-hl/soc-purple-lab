server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI container (strips the /api prefix).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback so client-side routes (e.g. /alerts/2) survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
