<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Analyst Console — architecture</text>

  <!-- arrows def -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- top row -->
  <!-- 1 browser -->
  <rect x="24"  y="70" width="200" height="92" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="124" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Analyst browser</text>
  <text x="124" y="126" text-anchor="middle" font-size="12" fill="#475569">React + TypeScript</text>
  <text x="124" y="144" text-anchor="middle" font-size="12" fill="#475569">Tailwind · TanStack Query</text>

  <!-- 2 nginx -->
  <rect x="268" y="70" width="200" height="92" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="368" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#155e75">nginx (web)</text>
  <text x="368" y="126" text-anchor="middle" font-size="12" fill="#475569">static build +</text>
  <text x="368" y="144" text-anchor="middle" font-size="12" fill="#475569">/api reverse proxy</text>

  <!-- 3 fastapi -->
  <rect x="512" y="70" width="200" height="92" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="612" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">FastAPI (api)</text>
  <text x="612" y="126" text-anchor="middle" font-size="12" fill="#475569">/alerts · /stats</text>
  <text x="612" y="144" text-anchor="middle" font-size="12" fill="#475569">/alerts/{id}/decision</text>

  <!-- 4 postgres -->
  <rect x="756" y="70" width="180" height="92" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="846" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">PostgreSQL</text>
  <text x="846" y="126" text-anchor="middle" font-size="12" fill="#475569">ops: alerts, tickets,</text>
  <text x="846" y="144" text-anchor="middle" font-size="12" fill="#475569">decisions · gold</text>

  <!-- top arrows -->
  <line x1="224" y1="116" x2="268" y2="116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="468" y1="116" x2="512" y2="116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="712" y1="116" x2="756" y2="116" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="246" y="62"  text-anchor="middle" font-size="10" fill="#94a3b8">HTTPS</text>
  <text x="490" y="62"  text-anchor="middle" font-size="10" fill="#94a3b8">proxy</text>
  <text x="734" y="62"  text-anchor="middle" font-size="10" fill="#94a3b8">SQL</text>

  <!-- feeders -->
  <rect x="512" y="300" width="200" height="88" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="612" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">AI triage pipeline</text>
  <text x="612" y="353" text-anchor="middle" font-size="12" fill="#475569">Wazuh → LLM triage</text>
  <text x="612" y="371" text-anchor="middle" font-size="12" fill="#475569">writes ops.alerts / tickets</text>

  <rect x="756" y="300" width="180" height="88" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="846" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Red scorer</text>
  <text x="846" y="353" text-anchor="middle" font-size="12" fill="#475569">per manche →</text>
  <text x="846" y="371" text-anchor="middle" font-size="12" fill="#475569">gold.fact_couverture</text>

  <!-- feeder arrows up into postgres -->
  <line x1="640" y1="300" x2="810" y2="166" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="846" y1="300" x2="846" y2="166" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <text x="480" y="420" text-anchor="middle" font-size="12" fill="#94a3b8">Same-origin: the browser calls /api, nginx proxies to the API — no CORS in production.</text>
</svg>
