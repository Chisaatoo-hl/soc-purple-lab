<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#495057"/>
    </marker>
    <marker id="arrp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7048e8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">SOC Purple Lab — Architecture</text>
  <text x="500" y="64" text-anchor="middle" font-size="13" fill="#868e96">Autonomous red to blue loop, fully local and measured</text>

  <!-- Row 1 : Attack -> Detection -->
  <rect x="40" y="110" width="240" height="92" rx="12" fill="#fff0f0" stroke="#e03131" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#c92a2a">AI Red Orchestrator</text>
  <text x="160" y="172" text-anchor="middle" font-size="12" fill="#e03131">plan + execute (whitelist)</text>
  <text x="160" y="189" text-anchor="middle" font-size="11" fill="#adb5bd">local LLM / Ollama</text>

  <rect x="380" y="110" width="240" height="92" rx="12" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
  <text x="500" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#495057">DC01 - Windows AD</text>
  <text x="500" y="172" text-anchor="middle" font-size="12" fill="#868e96">victim / Sysmon</text>
  <text x="500" y="189" text-anchor="middle" font-size="11" fill="#adb5bd">Atomic Red Team</text>

  <rect x="720" y="110" width="240" height="92" rx="12" fill="#e7f0fb" stroke="#1971c2" stroke-width="2"/>
  <text x="840" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#1864ab">Wazuh SIEM</text>
  <text x="840" y="172" text-anchor="middle" font-size="12" fill="#1971c2">detection / MITRE rules</text>
  <text x="840" y="189" text-anchor="middle" font-size="11" fill="#adb5bd">custom + default ruleset</text>

  <line x1="280" y1="156" x2="372" y2="156" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <text x="326" y="147" text-anchor="middle" font-size="11" fill="#495057">SSH</text>
  <line x1="620" y1="156" x2="712" y2="156" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <text x="666" y="147" text-anchor="middle" font-size="11" fill="#495057">Sysmon</text>

  <line x1="840" y1="202" x2="840" y2="292" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <text x="868" y="252" text-anchor="middle" font-size="11" fill="#495057">alerts</text>

  <!-- Row 2 : Triage -> Data -> BI (right to left) -->
  <rect x="720" y="300" width="240" height="92" rx="12" fill="#e7f0fb" stroke="#1971c2" stroke-width="2"/>
  <text x="840" y="340" text-anchor="middle" font-size="16" font-weight="600" fill="#1864ab">AI Triage Agent</text>
  <text x="840" y="362" text-anchor="middle" font-size="12" fill="#1971c2">local LLM / anti-injection</text>
  <text x="840" y="379" text-anchor="middle" font-size="11" fill="#adb5bd">facts = SIEM, judgment = LLM</text>

  <rect x="380" y="300" width="240" height="92" rx="12" fill="#e6f7f4" stroke="#0ca678" stroke-width="2"/>
  <text x="500" y="340" text-anchor="middle" font-size="16" font-weight="600" fill="#087f5b">Data pipeline</text>
  <text x="500" y="362" text-anchor="middle" font-size="12" fill="#0ca678">DuckDB medallion to Postgres</text>
  <text x="500" y="379" text-anchor="middle" font-size="11" fill="#adb5bd">bronze / silver / gold - star schema</text>

  <rect x="40" y="300" width="240" height="92" rx="12" fill="#e6f7f4" stroke="#0ca678" stroke-width="2"/>
  <text x="160" y="340" text-anchor="middle" font-size="16" font-weight="600" fill="#087f5b">Metabase BI</text>
  <text x="160" y="362" text-anchor="middle" font-size="12" fill="#0ca678">MTTD / verdicts / coverage</text>
  <text x="160" y="379" text-anchor="middle" font-size="11" fill="#adb5bd">live dashboard</text>

  <line x1="712" y1="346" x2="620" y2="346" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <text x="666" y="337" text-anchor="middle" font-size="11" fill="#495057">tickets</text>
  <line x1="372" y1="346" x2="280" y2="346" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <text x="326" y="337" text-anchor="middle" font-size="11" fill="#495057">gold</text>

  <!-- Scoring overlay -->
  <rect x="350" y="450" width="300" height="72" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="500" y="483" text-anchor="middle" font-size="15" font-weight="600" fill="#5f3dc4">Coverage scoring</text>
  <text x="500" y="503" text-anchor="middle" font-size="12" fill="#7048e8">attempted vs detected / MTTD</text>

  <path d="M280,202 C330,310 348,420 362,448" fill="none" stroke="#7048e8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrp)"/>
  <text x="330" y="430" text-anchor="middle" font-size="10" fill="#7048e8">attempted</text>
  <path d="M720,202 C670,310 652,420 638,448" fill="none" stroke="#7048e8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrp)"/>
  <text x="670" y="430" text-anchor="middle" font-size="10" fill="#7048e8">detected</text>
  <line x1="500" y1="450" x2="500" y2="394" stroke="#7048e8" stroke-width="1.8" marker-end="url(#arrp)"/>

  <text x="500" y="546" text-anchor="middle" font-size="11" fill="#adb5bd">Victims isolated on an internal network - AI, data and BI on the host - reproducible via Ansible + Docker</text>
</svg>
